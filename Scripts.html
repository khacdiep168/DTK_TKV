<!-- Scripts.html -->
<script>
/**
 * Scripts.html
 * Bộ điều khiển Client-side SPA cho Quản Lý Bãi Xe
 * Tự động nhận diện: Chạy trên Google Apps Script (google.script.run) hoặc Chạy Local Mock
 */

// Global State
// Global State
const AppState = {
  currentUser: null,
  activeView: 'dashboard',
  isGasEnvironment: (typeof google !== 'undefined' && google.script && google.script.run),
  dashboardChart: null,
  cachedInYardList: [],
  selectedImportData: null,
  currentInspectingGateIn: null,
  brandSettings: {
    APP_LOGO: 'Logo/logo.png',
    COMPANY_NAME: 'DTK LOGISTICS',
    APP_SUBTITLE: 'QUẢN LÝ BÃI XE XUẤT NHẬP KHẨU',
    TICKET_FOOTER_NOTE: 'Quý khách vui lòng giữ phiếu để đối soát khi ra cổng. Mọi thắc mắc liên hệ Hotline trực ban.'
  },
  rolePermissions: {
    'ADMIN': ['dashboard', 'gatein', 'yard', 'gateout', 'import', 'reports', 'settings'],
    'GATE_IN': ['gatein', 'import'],
    'YARD': ['yard'],
    'GATE_OUT': ['gateout'],
    'BAI': ['import', 'gatein']
  }
};

// ==========================================================================
// 1. BACKEND API CLIENT ADAPTER (GAS vs MOCK)
// ==========================================================================

const Api = {
  call: function(fnName, args) {
    args = args || [];
    return new Promise((resolve, reject) => {
      if (AppState.isGasEnvironment) {
        google.script.run
          .withSuccessHandler(res => {
            if (res && res.success === false) {
              reject(res);
            } else {
              resolve(res);
            }
          })
          .withFailureHandler(err => reject({ success: false, message: err.message || err }))
          [fnName].apply(google.script.run, args);
      } else {
        // Standalone Local Mock Fallback
        setTimeout(() => {
          try {
            if (!MockBackend[fnName]) {
              reject({ success: false, message: 'API chưa được định nghĩa: ' + fnName });
              return;
            }
            const mockRes = MockBackend[fnName].apply(MockBackend, args);
            if (mockRes && mockRes.success === false) {
              reject(mockRes);
            } else {
              resolve(mockRes);
            }
          } catch (e) {
            reject({ success: false, message: e.message });
          }
        }, 150);
      }
    });
  }
};

// ==========================================================================
// 2. INITIALIZATION, AUTHENTICATION & ROUTING
// ==========================================================================

document.addEventListener('DOMContentLoaded', function() {
  initApp();
});

function initApp() {
  // 1. Nạp Brand Settings từ LocalStorage nếu có
  try {
    const savedBrand = localStorage.getItem('dtk_brand_settings');
    if (savedBrand) {
      AppState.brandSettings = Object.assign(AppState.brandSettings, JSON.parse(savedBrand));
      applyBrandSettingsToUI();
    }
  } catch (e) {}

  // 2. Kiểm tra phiên đăng nhập đã lưu
  let savedSession = null;
  try {
    savedSession = JSON.parse(localStorage.getItem('dtk_session') || 'null');
  } catch (e) {}

  // 3. Gọi khởi tạo từ Server / Backend
  Api.call('apiGetInitialData')
    .then(res => {
      if (res && res.data) {
        if (res.data.settings) {
          AppState.brandSettings = Object.assign(AppState.brandSettings, res.data.settings);
          applyBrandSettingsToUI();
        }
        if (res.data.rolePermissions) {
          AppState.rolePermissions = res.data.rolePermissions;
        }

        // Ưu tiên session đã đăng nhập, nếu chưa có thì dùng user trả về hoặc hiện Modal Login
        if (savedSession && savedSession.isLoggedIn) {
          AppState.currentUser = savedSession;
        } else if (res.data.user && res.data.user.isLoggedIn) {
          AppState.currentUser = res.data.user;
        }
      }

      if (AppState.currentUser && AppState.currentUser.isLoggedIn) {
        updateUserUI();
        applyUserPermissions(AppState.currentUser);
      } else {
        showLoginModal();
      }
    })
    .catch(err => {
      console.warn('Init fallback:', err);
      if (savedSession && savedSession.isLoggedIn) {
        AppState.currentUser = savedSession;
        updateUserUI();
        applyUserPermissions(AppState.currentUser);
      } else {
        showLoginModal();
      }
    });
}

function updateUserUI() {
  const u = AppState.currentUser;
  const nameEl = document.getElementById('user-display-name');
  const roleEl = document.getElementById('user-role-tag');
  const avatarEl = document.getElementById('user-avatar-initial');
  if (u) {
    if (nameEl) nameEl.textContent = u.name || u.email;
    if (roleEl) roleEl.textContent = u.role || 'USER';
    if (avatarEl) avatarEl.textContent = (u.name || u.email || 'A').charAt(0).toUpperCase();
  } else {
    if (nameEl) nameEl.textContent = 'Chưa đăng nhập';
    if (roleEl) roleEl.textContent = 'GUEST';
    if (avatarEl) avatarEl.textContent = '?';
  }
}

function applyUserPermissions(user) {
  if (!user || !user.role) return;

  const role = user.role;
  const allowedViews = AppState.rolePermissions[role] || 
    (role === 'ADMIN' ? ['dashboard', 'gatein', 'yard', 'gateout', 'import', 'reports', 'settings'] : ['dashboard']);

  // Map các view với ID nav-link tương ứng
  const navMap = {
    'dashboard': 'nav-dashboard',
    'gatein': 'nav-gatein',
    'yard': 'nav-yard',
    'gateout': 'nav-gateout',
    'import': 'nav-import',
    'reports': 'nav-reports',
    'settings': 'nav-settings'
  };

  // Ẩn/hiện các tab menu trên sidebar
  Object.keys(navMap).forEach(view => {
    const navEl = document.getElementById(navMap[view]);
    if (navEl) {
      const parentLi = navEl.closest('.nav-item');
      if (allowedViews.includes(view) || role === 'ADMIN') {
        if (parentLi) parentLi.classList.remove('d-none');
        navEl.classList.remove('d-none');
      } else {
        if (parentLi) parentLi.classList.add('d-none');
        navEl.classList.add('d-none');
      }
    }
  });

  // Tự động chuyển view sang màn hình được cấp quyền đầu tiên nếu view hiện tại không thuộc quyền
  if (!allowedViews.includes(AppState.activeView) && role !== 'ADMIN') {
    navigateTo(allowedViews[0]);
  } else {
    navigateTo(AppState.activeView || allowedViews[0]);
  }
}

function navigateTo(viewName) {
  const user = AppState.currentUser;
  if (!user || !user.isLoggedIn) {
    showLoginModal();
    return;
  }

  const role = user.role;
  const allowedViews = AppState.rolePermissions[role] || 
    (role === 'ADMIN' ? ['dashboard', 'gatein', 'yard', 'gateout', 'import', 'reports', 'settings'] : []);

  if (role !== 'ADMIN' && !allowedViews.includes(viewName)) {
    Swal.fire({
      icon: 'warning',
      title: 'Không có quyền truy cập',
      text: `Vai trò [${role}] không có quyền thực hiện chức năng này.`
    });
    return;
  }

  AppState.activeView = viewName;
  document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));

  const targetView = document.getElementById('view-' + viewName);
  if (targetView) targetView.classList.add('active');

  const navItem = document.getElementById('nav-' + viewName);
  if (navItem) navItem.classList.add('active');

  // Đóng sidebar trên mobile nếu đang mở
  toggleSidebar(false);

  // Kích hoạt nạp dữ liệu view tương ứng
  if (viewName === 'dashboard') loadDashboardKPIs('TODAY');
  if (viewName === 'gatein') loadRecentGateIns();
  if (viewName === 'yard') loadVehiclesInYard();
  if (viewName === 'gateout') loadReadyToExitVehicles();
  if (viewName === 'import') loadImportBatches();
  if (viewName === 'reports') loadCompletedReport();
  if (viewName === 'settings') switchSettingsTab('brand');
}

// --------------------------------------------------------------------------
// AUTHENTICATION: LOGIN, LOGOUT & SWITCH ROLE
// --------------------------------------------------------------------------

function showLoginModal() {
  const modalEl = document.getElementById('loginModal');
  if (modalEl) {
    let modal = bootstrap.Modal.getInstance(modalEl);
    if (!modal) {
      modal = new bootstrap.Modal(modalEl, { backdrop: 'static', keyboard: false });
    }
    modal.show();
  }
}

function hideLoginModal() {
  const modalEl = document.getElementById('loginModal');
  if (modalEl) {
    const modal = bootstrap.Modal.getInstance(modalEl);
    if (modal) modal.hide();
  }
}

function submitLoginForm() {
  const uInput = document.getElementById('login-input-username');
  const pInput = document.getElementById('login-input-password');
  const errAlert = document.getElementById('login-error-alert');
  const errMsg = document.getElementById('login-error-msg');
  const submitBtn = document.getElementById('btn-login-submit');

  const username = uInput ? uInput.value.trim() : '';
  const password = pInput ? pInput.value.trim() : '';

  if (!username) {
    if (errAlert) {
      errAlert.classList.remove('d-none');
      errMsg.textContent = 'Vui lòng nhập tài khoản hoặc email.';
    }
    return;
  }

  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Đang xác thực...';
  }
  if (errAlert) errAlert.classList.add('d-none');

  Api.call('apiLogin', [username, password])
    .then(res => {
      if (res && res.data) {
        handleLoginSuccess(res.data);
      }
    })
    .catch(err => {
      if (errAlert) {
        errAlert.classList.remove('d-none');
        errMsg.textContent = err.message || 'Tài khoản hoặc mật khẩu không chính xác.';
      }
    })
    .finally(() => {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Đăng Nhập';
      }
    });
}

function handleLoginSuccess(user) {
  AppState.currentUser = user;
  localStorage.setItem('dtk_session', JSON.stringify(user));
  hideLoginModal();
  updateUserUI();
  applyUserPermissions(user);

  Swal.fire({
    icon: 'success',
    title: 'Đăng nhập thành công!',
    text: `Xin chào ${user.name || user.email} (${user.role})`,
    timer: 1500,
    showConfirmButton: false
  });
}

function quickLoginAs(role) {
  const creds = {
    'ADMIN': { u: 'admin@dtk.local', p: 'admin' },
    'GATE_IN': { u: 'gatein@dtk.local', p: '123' },
    'YARD': { u: 'yard@dtk.local', p: '123' },
    'GATE_OUT': { u: 'gateout@dtk.local', p: '123' }
  };
  const c = creds[role] || { u: 'admin@dtk.local', p: 'admin' };
  const uInput = document.getElementById('login-input-username');
  const pInput = document.getElementById('login-input-password');
  if (uInput) uInput.value = c.u;
  if (pInput) pInput.value = c.p;
  submitLoginForm();
}

function doLogout() {
  Swal.fire({
    title: 'Đăng xuất khỏi hệ thống?',
    text: 'Bạn sẽ cần đăng nhập lại để tiếp tục sử dụng các chức năng.',
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#2563eb',
    cancelButtonColor: '#64748b',
    confirmButtonText: 'Đăng Xuất',
    cancelButtonText: 'Hủy'
  }).then(res => {
    if (res.isConfirmed) {
      localStorage.removeItem('dtk_session');
      AppState.currentUser = null;
      updateUserUI();
      showLoginModal();
    }
  });
}

function togglePasswordVisibility(inputId) {
  const el = document.getElementById(inputId);
  const icon = document.getElementById('login-eye-icon');
  if (!el) return;
  if (el.type === 'password') {
    el.type = 'text';
    if (icon) { icon.classList.remove('bi-eye'); icon.classList.add('bi-eye-slash'); }
  } else {
    el.type = 'password';
    if (icon) { icon.classList.remove('bi-eye-slash'); icon.classList.add('bi-eye'); }
  }
}

function toggleSidebar(forceState) {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  if (!sidebar) return;

  const willShow = (forceState !== undefined) ? forceState : !sidebar.classList.contains('show');
  if (willShow) {
    sidebar.classList.add('show');
    if (backdrop) backdrop.classList.add('show');
  } else {
    sidebar.classList.remove('show');
    if (backdrop) backdrop.classList.remove('show');
  }
}

// ==========================================================================
// 3. DASHBOARD LOGIC
// ==========================================================================

function loadDashboardKPIs(period, btn) {
  if (btn) {
    const parent = btn.parentElement;
    parent.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  Api.call('apiGetDashboardKPIs', [period])
    .then(res => {
      const d = res.data;
      if (!d) return;

      document.getElementById('kpi-import').textContent = d.importCount || 0;
      document.getElementById('kpi-export').textContent = d.exportCount || 0;
      document.getElementById('kpi-inyard').textContent = d.inYardCount || 0;
      document.getElementById('kpi-ready').textContent = d.readyToExitCount || 0;
      document.getElementById('kpi-completed').textContent = d.completedCount || 0;
      document.getElementById('kpi-over24h').textContent = d.over24hCount || 0;
      document.getElementById('kpi-revenue').textContent = d.revenueFormatted || '0 VNĐ';

      renderDashboardChart(d.chartData || []);
    })
    .catch(err => console.error('Lỗi tải KPI:', err));

  // Tải xe trong bãi gần đây cho Dashboard
  Api.call('apiGetVehiclesInYard')
    .then(res => {
      const list = (res.data || []).slice(0, 5);
      const tbody = document.getElementById('dashboard-recent-yard-tbody');
      if (!tbody) return;

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-3 text-muted">Hiện không có xe trong bãi.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(v => `
        <tr>
          <td class="fw-bold">${v.licensePlate}</td>
          <td><span class="badge bg-light text-dark border">${v.vehicleType}</span></td>
          <td><span class="badge-dir-${String(v.cargoDirection).toLowerCase()}">${v.cargoDirection}</span></td>
          <td>${v.containerNo || '—'}</td>
          <td>${v.company || '—'}</td>
          <td>${v.inYardTime || '—'}</td>
          <td>
            <span class="fw-semibold">${v.durationFormatted}</span>
            ${v.isOver24h ? '<span class="badge-over24h ms-1"><i class="bi bi-clock-history"></i> Quá 24h</span>' : ''}
          </td>
          <td><span class="badge-status badge-${v.status}">${v.status}</span></td>
        </tr>
      `).join('');
    });
}

function renderDashboardChart(chartData) {
  const ctx = document.getElementById('dashboard-trend-chart');
  if (!ctx) return;

  const labels = chartData.map(c => c.date);
  const imports = chartData.map(c => c.importCount);
  const exports = chartData.map(c => c.exportCount);

  if (AppState.dashboardChart) {
    AppState.dashboardChart.destroy();
  }

  AppState.dashboardChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Nhập khẩu',
          data: imports,
          backgroundColor: '#2563eb',
          borderRadius: 4
        },
        {
          label: 'Xuất khẩu',
          data: exports,
          backgroundColor: '#9333ea',
          borderRadius: 4
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', align: 'end' }
      },
      scales: {
        y: { beginAtZero: true, ticks: { precision: 0 } }
      }
    }
  });
}

// ==========================================================================
// 4. GATE IN LOGIC
// ==========================================================================

function searchGateInVehicle() {
  const input = document.getElementById('gatein-plate-input');
  const plate = input.value.trim();
  if (!plate) {
    Swal.fire({ icon: 'warning', title: 'Chưa nhập biển số', text: 'Vui lòng nhập biển số xe trước khi tìm.' });
    return;
  }

  Api.call('apiSearchGateIn', [plate])
    .then(res => {
      const v = res.data;
      AppState.currentInspectingGateIn = v;

      document.getElementById('gatein-placeholder').style.display = 'none';
      document.getElementById('gatein-inspection-card').style.display = 'block';

      document.getElementById('gatein-info-plate').textContent = v.LicensePlate;
      document.getElementById('gatein-info-type').textContent = v.VehicleType;
      document.getElementById('gatein-info-direction').textContent = v.CargoDirection;
      document.getElementById('gatein-info-container').textContent = v.ContainerNo || '—';
      document.getElementById('gatein-info-weight').textContent = v.WeightKg ? (Number(v.WeightKg).toLocaleString() + ' kg') : '—';
      document.getElementById('gatein-info-company').textContent = v.Company || '—';
      document.getElementById('gatein-info-driver').textContent = (v.DriverName || '—') + (v.DriverPhone ? (' (' + v.DriverPhone + ')') : '');
      document.getElementById('gatein-info-regdate').textContent = v.RegistrationDate || '—';

      const statusBadge = document.getElementById('gatein-vehicle-status-badge');
      statusBadge.className = 'badge-status badge-' + v.Status;
      statusBadge.textContent = v.Status;
    })
    .catch(err => {
      Swal.fire({ icon: 'error', title: 'Không tìm thấy xe', text: err.message || 'Biển số chưa được đăng ký hoặc không hợp lệ.' });
    });
}

function confirmGateIn() {
  const v = AppState.currentInspectingGateIn;
  if (!v || !v.VehicleID) return;

  Swal.fire({
    title: 'Xác nhận Gate In?',
    html: `Cho phép xe <strong>${v.LicensePlate}</strong> vào bãi và tạo phiếu?`,
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#2563eb',
    confirmButtonText: 'Đồng ý cho vào',
    cancelButtonText: 'Hủy'
  }).then(result => {
    if (result.isConfirmed) {
      Api.call('apiApproveGateIn', [v.VehicleID, ''])
        .then(res => {
          Swal.fire({ icon: 'success', title: 'Thành công!', text: 'Xe đã được duyệt vào bãi thành công.' });
          
          // Reset view tìm xe
          document.getElementById('gatein-plate-input').value = '';
          document.getElementById('gatein-inspection-card').style.display = 'none';
          document.getElementById('gatein-placeholder').style.display = 'block';

          loadRecentGateIns();

          // Hiển thị phiếu in ngay lập tức
          if (res.data && res.data.ticket) {
            showTicketModal(res.data.ticket);
          }
        })
        .catch(err => {
          Swal.fire({ icon: 'error', title: 'Lỗi Gate In', text: err.message });
        });
    }
  });
}

function loadRecentGateIns() {
  Api.call('apiGetVehiclesInYard')
    .then(res => {
      const list = (res.data || []).slice(0, 10);
      const tbody = document.getElementById('gatein-recent-tbody');
      if (!tbody) return;

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-muted">Chưa có lượt xe vào bãi gần đây.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(item => `
        <tr>
          <td class="fw-bold text-primary">${item.ticketNo}</td>
          <td class="fw-bold">${item.licensePlate}</td>
          <td>${item.inYardTime}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary" onclick="reprintTicket('${item.ticketNo}')">
              <i class="bi bi-printer"></i> In
            </button>
          </td>
        </tr>
      `).join('');
    });
}

function showTicketModal(ticket) {
  document.getElementById('t-ticket-no').textContent = ticket.ticketNo;
  document.getElementById('t-plate').textContent = ticket.licensePlate;
  document.getElementById('t-type').textContent = ticket.vehicleType;
  document.getElementById('t-direction').textContent = ticket.cargoDirection;
  document.getElementById('t-container').textContent = ticket.containerNo || '—';
  document.getElementById('t-company').textContent = ticket.company || '—';
  document.getElementById('t-driver').textContent = ticket.driverName || '—';
  document.getElementById('t-intime').textContent = ticket.gateInTime;

  // Tạo mã QR Code
  const qrContainer = document.getElementById('modal-ticket-qr');
  qrContainer.innerHTML = '';
  new QRCode(qrContainer, {
    text: ticket.qrPayload || ticket.ticketNo,
    width: 130,
    height: 130,
    correctLevel: QRCode.CorrectLevel.M
  });

  const modal = new bootstrap.Modal(document.getElementById('ticketModal'));
  modal.show();
}

function reprintTicket(ticketNo) {
  Api.call('apiGetTicketReprint', [ticketNo])
    .then(res => {
      if (res.data) showTicketModal(res.data);
    })
    .catch(err => Swal.fire({ icon: 'error', title: 'Lỗi', text: err.message }));
}

function printTicketFromModal() {
  const cardContent = document.getElementById('modal-ticket-card').innerHTML;
  const printArea = document.getElementById('print-ticket-area');
  printArea.innerHTML = cardContent;
  window.print();
}

// ==========================================================================
// 5. YARD MANAGEMENT LOGIC
// ==========================================================================

function loadVehiclesInYard() {
  Api.call('apiGetVehiclesInYard')
    .then(res => {
      AppState.cachedInYardList = res.data || [];
      filterYardTable();
    })
    .catch(err => console.error('Lỗi nạp xe trong bãi:', err));
}

function filterYardTable() {
  const keyword = (document.getElementById('yard-search-input').value || '').trim().toLowerCase();
  const dirFilter = document.getElementById('yard-filter-direction').value;
  const statusFilter = document.getElementById('yard-filter-status').value;

  let list = AppState.cachedInYardList;

  if (dirFilter !== 'ALL') {
    list = list.filter(v => v.cargoDirection === dirFilter);
  }
  if (statusFilter !== 'ALL') {
    if (statusFilter === 'OVER24H') {
      list = list.filter(v => v.isOver24h);
    } else {
      list = list.filter(v => v.status === statusFilter);
    }
  }
  if (keyword) {
    list = list.filter(v => {
      return (
        String(v.licensePlate).toLowerCase().includes(keyword) ||
        String(v.containerNo).toLowerCase().includes(keyword) ||
        String(v.company).toLowerCase().includes(keyword) ||
        String(v.ticketNo).toLowerCase().includes(keyword)
      );
    });
  }

  document.getElementById('yard-total-count').textContent = list.length + ' xe';

  const tbody = document.getElementById('yard-vehicles-tbody');
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4 text-muted">Không tìm thấy phương tiện nào phù hợp với bộ lọc.</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(v => {
    const isReady = (v.status === 'READY_TO_EXIT');
    return `
      <tr>
        <td class="fw-bold">${v.licensePlate}</td>
        <td>${v.containerNo || '—'}</td>
        <td><span class="badge bg-light text-dark border">${v.vehicleType}</span></td>
        <td><span class="badge-dir-${String(v.cargoDirection).toLowerCase()}">${v.cargoDirection}</span></td>
        <td>${v.company || '—'}</td>

function callVehicleBySpeaker(plate) {
  const speechText = `Xin mời xe biển số ${plate.split('').join(' ')} di chuyển ra cổng xuất bãi!`;
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(speechText);
    utterance.lang = 'vi-VN';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
    Swal.fire({
      toast: true,
      position: 'top-end',
      icon: 'info',
      title: 'Đang phát loa: ' + speechText,
      showConfirmButton: false,
      timer: 3000
    });
  } else {
    Swal.fire({ icon: 'info', title: 'Gọi xe bằng loa', text: speechText });
  }
}

function selectReadyVehicleForOut(ticketNo, plate) {
  document.getElementById('gateout-search-input').value = ticketNo;
  inspectGateOutTicket();
}

function inspectGateOutTicket() {
  const input = document.getElementById('gateout-search-input');
  const searchKey = input.value.trim();
  if (!searchKey) {
    Swal.fire({ icon: 'warning', title: 'Chưa nhập thông tin', text: 'Vui lòng quét QR hoặc nhập số vé / biển số.' });
    return;
  }

  Api.call('apiInspectGateOut', [searchKey])
    .then(res => {
      const d = res.data;
      const v = d.vehicle;
      const gi = d.gateIn;
      const fee = d.previewFee;

      AppState.currentInspectingGateOut = { vehicle: v, gateIn: gi, fee: fee };

      document.getElementById('gateout-placeholder').style.display = 'none';
      document.getElementById('gateout-inspection-card').style.display = 'block';

      document.getElementById('gateout-info-ticket').textContent = gi.TicketNo;
      document.getElementById('gateout-info-plate').textContent = v.LicensePlate;
      document.getElementById('gateout-info-type').textContent = v.VehicleType;
      document.getElementById('gateout-info-container').textContent = v.ContainerNo || '—';
      document.getElementById('gateout-info-intime').textContent = gi.GateInTime;
      document.getElementById('gateout-info-outtime').textContent = d.inspectTime;

      document.getElementById('gateout-calc-duration').textContent = fee.formattedDuration;
      document.getElementById('gateout-calc-days').textContent = fee.chargeDays + ' ngày';
      document.getElementById('gateout-calc-unitprice').textContent = 'Đơn giá: ' + fee.formattedUnitPrice + '/ngày';
      document.getElementById('gateout-calc-total').textContent = fee.formattedTotalAmount;

      document.getElementById('gateout-actual-plate').value = v.LicensePlate; // Tự động điền gợi ý để đối chiếu nhanh
    })
    .catch(err => {
      Swal.fire({ icon: 'error', title: 'Từ chối Gate Out', text: err.message });
    });
}

function confirmGateOut() {
  const info = AppState.currentInspectingGateOut;
  if (!info || !info.gateIn) return;

  const actualPlate = document.getElementById('gateout-actual-plate').value.trim();
  if (!actualPlate) {
    Swal.fire({ icon: 'warning', title: 'Thiếu biển số thực tế', text: 'Nhân viên bắt buộc nhập đối chiếu biển số thực tế trước cổng.' });
    return;
  }

  Swal.fire({
    title: 'Xác nhận Gate Out?',
    html: `Duyệt cho xe <strong>${info.vehicle.LicensePlate}</strong> ra bãi và thu phí <strong>${info.fee.formattedTotalAmount}</strong>?`,
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#16a34a',
    confirmButtonText: 'Đồng ý cho ra & Thu phí',
    cancelButtonText: 'Hủy'
  }).then(result => {
    if (result.isConfirmed) {
      Api.call('apiApproveGateOut', [info.gateIn.TicketNo, actualPlate])
        .then(res => {
          Swal.fire({ icon: 'success', title: 'Thành công!', text: 'Xe đã xuất bãi thành công.' });
          
          document.getElementById('gateout-search-input').value = '';
          document.getElementById('gateout-inspection-card').style.display = 'none';
          document.getElementById('gateout-placeholder').style.display = 'block';

          loadReadyToExitVehicles();

          // Hiển thị biên lai xuất bãi
          if (res.data) showReceiptModal(res.data);
        })
        .catch(err => {
          Swal.fire({ icon: 'error', title: 'Lỗi Gate Out', text: err.message });
        });
    }
  });
}

function handleExcelFileSelect(input) {

function processExcelUpload() {
  const fileInput = document.getElementById('excel-file-input');
  const companyInput = document.getElementById('import-company-input').value.trim();
  const file = fileInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

      Api.call('apiValidateImport', [jsonRows, file.name, companyInput])
        .then(res => {
          const previewCard = document.getElementById('import-preview-container');
          const errorCard = document.getElementById('import-error-container');

          if (!res.success) {
            // Hiển thị lỗi theo CLAUDE.md Section 8
            previewCard.classList.add('d-none');
            errorCard.classList.remove('d-none');

            const tbody = document.getElementById('import-error-tbody');
            tbody.innerHTML = (res.errors || []).map(err => `
              <tr>
                <td class="fw-bold text-danger">Dòng ${err.row}</td>
                <td class="fw-semibold">${err.column}</td>
                <td><code>${err.value || '(Trống)'}</code></td>
                <td>${err.message}</td>
              </tr>
            `).join('');
          } else {
            // Thành công - Hiển thị preview
            errorCard.classList.add('d-none');
            previewCard.classList.remove('d-none');

            AppState.selectedImportData = res;
            document.getElementById('import-preview-summary').textContent = `${res.validRowsCount} phương tiện hợp lệ sẵn sàng import.`;

            const tbody = document.getElementById('import-preview-tbody');
            tbody.innerHTML = (res.previewData || []).map(r => `
              <tr>
                <td class="fw-bold">${r.LicensePlate}</td>
                <td>${r.VehicleType}</td>
                <td><span class="badge-dir-${String(r.CargoDirection).toLowerCase()}">${r.CargoDirection}</span></td>
                <td>${r.ContainerNo || '—'}</td>
                <td>${r.WeightKg ? (Number(r.WeightKg).toLocaleString() + ' kg') : '—'}</td>
                <td>${r.Company}</td>
                <td>${r.DriverName || '—'}</td>
                <td>${r.RegistrationDate}</td>
              </tr>
            `).join('');
          }
        })
        .catch(err => {
          Swal.fire({ icon: 'error', title: 'Lỗi đọc file', text: err.message });
        });
    } catch (ex) {
      Swal.fire({ icon: 'error', title: 'Lỗi parse file Excel', text: ex.message });
    }
  };
  reader.readAsArrayBuffer(file);
}

function confirmCommitImport() {

  Swal.fire({

  if (noteEl) noteEl.value = defaults.TICKET_FOOTER_NOTE;

function saveBrandSettings() {
  const compName = document.getElementById('setting-company-name').value.trim();
  const appSub = document.getElementById('setting-app-subtitle').value.trim();
  const logoUrl = document.getElementById('setting-logo-url').value.trim();
  const ticketNote = document.getElementById('setting-ticket-note').value.trim();

  if (!compName || !appSub) {
    Swal.fire({ icon: 'warning', title: 'Thiếu thông tin', text: 'Vui lòng điền Tên Doanh Nghiệp và Tiêu Đề Hệ Thống.' });
    return;
  }

  const brandData = {
    COMPANY_NAME: compName,
    APP_SUBTITLE: appSub,
    APP_LOGO: logoUrl || 'Logo/logo.png',
    TICKET_FOOTER_NOTE: ticketNote
  };

  const btn = document.getElementById('btn-save-brand');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Đang lưu cấu hình...';
  }

  Api.call('apiSaveBrandSettings', [brandData])
    .then(res => {
      AppState.brandSettings = brandData;
      localStorage.setItem('dtk_brand_settings', JSON.stringify(brandData));
      applyBrandSettingsToUI();
      Swal.fire({ icon: 'success', title: 'Thành công', text: res.message || 'Cập nhật cấu hình thương hiệu thành công!' });
    })
    .catch(err => {
      Swal.fire({ icon: 'error', title: 'Lỗi lưu cấu hình', text: err.message });
    })
    .finally(() => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Lưu Cấu Hình Thương Hiệu';
      }
    });
}

          period: period,
          importCount: db.VEHICLES.filter(v => v.CargoDirection === 'IMPORT').length,
          exportCount: db.VEHICLES.filter(v => v.CargoDirection === 'EXPORT').length,
          inYardCount: inYard,
          readyToExitCount: ready,
          completedCount: db.FEES.length,
          over24hCount: 1,
          revenue: db.FEES.reduce((s, f) => s + f.TotalAmount, 0),
          revenueFormatted: db.FEES.reduce((s, f) => s + f.TotalAmount, 0).toLocaleString('vi-VN') + ' VNĐ',

            { date: '04/10', importCount: 2, exportCount: 5 },
            { date: '05/10', importCount: 5, exportCount: 4 },

            { date: '07/10', importCount: 4, exportCount: 4 },
            { date: '08/10', importCount: 3, exportCount: 2 }
          ]
        }
      };
    },
    apiSearchGateIn: (plate) => {
      const db = getDB();
      const norm = plate.replace(/[\s\-\.]/g, '').toUpperCase();
      const v = db.VEHICLES.find(item => item.LicensePlate.replace(/[\s\-\.]/g, '').toUpperCase() === norm);
      if (!v) return { success: false, message: 'Không tìm thấy xe ' + plate };
      if (v.Status !== 'REGISTERED' && v.Status !== 'WAITING_GATE_IN') {
        return { success: false, message: 'Xe đang ở trạng thái ' + v.Status };
      }
      return { success: true, data: v };
    },
    apiApproveGateIn: (vId) => {
      const db = getDB();
      const v = db.VEHICLES.find(i => i.VehicleID === vId);
      if (!v) return { success: false, message: 'Không tìm thấy xe' };
      v.Status = 'IN_YARD';

      const ticketNo = 'BAI-20261008-' + Math.floor(100000 + Math.random() * 900000);
      const gateInTime = '08/10/2026 09:00:00';

      db.GATE_IN.push({ GateInID: 'GI-' + Date.now(), VehicleID: v.VehicleID, TicketNo: ticketNo, GateInTime: gateInTime, GateInBy: 'gatein@dtk.local', Status: 'COMPLETED' });
      db.YARD.push({ YardID: 'YD-' + Date.now(), VehicleID: v.VehicleID, GateInID: 'GI-' + Date.now(), InYardTime: gateInTime, ReadyToExitTime: '', Status: 'IN_YARD' });
      saveDB(db);

      return {
        success: true,
        data: {
          ticket: {
            ticketNo: ticketNo,
            licensePlate: v.LicensePlate,
            vehicleType: v.VehicleType,
            cargoDirection: v.CargoDirection,
            containerNo: v.ContainerNo,
            company: v.Company,
            driverName: v.DriverName,
            gateInTime: gateInTime,
            qrPayload: ticketNo
          }
        }
      };
    },
    apiGetTicketReprint: (ticketNo) => {
      const db = getDB();
      const gi = db.GATE_IN.find(i => i.TicketNo === ticketNo);
      if (!gi) return { success: false, message: 'Không tìm thấy vé' };
      const v = db.VEHICLES.find(i => i.VehicleID === gi.VehicleID) || {};
      return {
        success: true,
        data: {
          ticketNo: gi.TicketNo,
          licensePlate: v.LicensePlate,
          vehicleType: v.VehicleType,
          cargoDirection: v.CargoDirection,
          containerNo: v.ContainerNo,
          company: v.Company,
          driverName: v.DriverName,
          gateInTime: gi.GateInTime,
          qrPayload: gi.TicketNo
        }
      };
    },
    apiGetVehiclesInYard: () => {
      const db = getDB();
      const list = db.YARD.filter(y => y.Status === 'IN_YARD' || y.Status === 'READY_TO_EXIT').map(y => {
        const v = db.VEHICLES.find(i => i.VehicleID === y.VehicleID) || {};
        const gi = db.GATE_IN.find(i => i.VehicleID === y.VehicleID) || {};
        const isOver = y.InYardTime.includes('07/10');
        return {
          yardId: y.YardID,
          vehicleId: y.VehicleID,
          ticketNo: gi.TicketNo || '—',
          licensePlate: v.LicensePlate || '—',
          vehicleType: v.VehicleType || '—',
          cargoDirection: v.CargoDirection || '—',
          containerNo: v.ContainerNo || '—',
          company: v.Company || '—',
          inYardTime: y.InYardTime,
          status: y.Status,
          durationFormatted: isOver ? '1 ngày 1 giờ 30 phút' : '2 giờ 15 phút',
          isOver24h: isOver
        };
      });
      return { success: true, data: list };
    },
    apiApproveReadyToExit: (vId) => {
      const db = getDB();
      const y = db.YARD.find(i => i.VehicleID === vId);
      const v = db.VEHICLES.find(i => i.VehicleID === vId);
      if (y) y.Status = 'READY_TO_EXIT';
      if (v) v.Status = 'READY_TO_EXIT';
      saveDB(db);
      return { success: true, message: 'Duyệt Ready To Exit thành công' };
    },
    apiGetReadyToExitVehicles: () => {
      const db = getDB();
      const ready = db.YARD.filter(y => y.Status === 'READY_TO_EXIT').map(y => {
        const v = db.VEHICLES.find(i => i.VehicleID === y.VehicleID) || {};
        const gi = db.GATE_IN.find(i => i.VehicleID === y.VehicleID) || {};
        return {
          vehicleId: y.VehicleID,
          ticketNo: gi.TicketNo,
          licensePlate: v.LicensePlate,
          containerNo: v.ContainerNo,
          durationFormatted: '1 ngày 1 giờ 30 phút'
        };
      });
      return { success: true, data: ready };
    },
    apiInspectGateOut: (key) => {
      const db = getDB();
      const norm = key.replace(/[\s\-\.]/g, '').toUpperCase();
      const gi = db.GATE_IN.find(i => i.TicketNo === key || i.TicketNo.toUpperCase() === norm) || db.GATE_IN[1];
      const v = db.VEHICLES.find(i => i.VehicleID === gi.VehicleID) || db.VEHICLES[1];

      if (v.Status !== 'READY_TO_EXIT') {
        return { success: false, message: '❌ XE CHƯA ĐƯỢC DUYỆT CHỜ RA. Trạng thái hiện tại: ' + v.Status };
      }

      return {
        success: true,
        data: {
          vehicle: v,
          gateIn: gi,
          inspectTime: '08/10/2026 09:30:00',
          previewFee: {
            formattedDuration: '25 giờ 30 phút',
            chargeDays: 2,
            unitPrice: 70000,
            totalAmount: 140000,
            formattedUnitPrice: '70.000 VNĐ',
            formattedTotalAmount: '140.000 VNĐ'
          }
        }
      };
    },
    apiApproveGateOut: (ticketNo, plate) => {
      const db = getDB();
      const gi = db.GATE_IN.find(i => i.TicketNo === ticketNo);
      const v = db.VEHICLES.find(i => i.VehicleID === gi.VehicleID);
      const y = db.YARD.find(i => i.VehicleID === gi.VehicleID);

      if (v) v.Status = 'COMPLETED';
      if (y) y.Status = 'COMPLETED';

      db.FEES.push({
        FeeID: 'FEE-' + Date.now(),
        VehicleID: v.VehicleID,
        CargoDirection: v.CargoDirection,
        VehicleType: v.VehicleType,
        GateInTime: gi.GateInTime,
        GateOutTime: '08/10/2026 09:35:00',
        TotalHours: 25.5,
        ChargeDays: 2,
        UnitPrice: 70000,
        TotalAmount: 140000,
        CalculatedAt: '08/10/2026 09:35:00'
      });
      saveDB(db);

      return {
        success: true,
        data: {
          ticketNo: ticketNo,
          licensePlate: v.LicensePlate,
          vehicleType: v.VehicleType,
          containerNo: v.ContainerNo,
          gateInTime: gi.GateInTime,
          gateOutTime: '08/10/2026 09:35:00',
          duration: '25 giờ 30 phút',
          chargeDays: 2,
          formattedTotalAmount: '140.000 VNĐ',
          gateOutBy: 'gateout@dtk.local'
        }
      };
    },
    apiValidateImport: (rows, fName, comp) => {
      if (!rows || rows.length === 0) return { success: false, errors: [{ row: 1, column: 'File', message: 'File trống' }] };
      const valid = rows.map((r, idx) => ({
        VehicleID: 'VH-IMP-' + idx,
        LicensePlate: r.LicensePlate || r['Biển số xe'] || '51C-0000' + idx,
        VehicleType: r.VehicleType || 'CONTAINER',
        CargoDirection: r.CargoDirection || 'IMPORT',
        ContainerNo: r.ContainerNo || 'CONT00' + idx,
        WeightKg: r.WeightKg || 25000,
        Company: r.Company || comp || 'NHÀ XE DEMO',
        DriverName: r.DriverName || 'Tài Xế Test',
        RegistrationDate: '08/10/2026'
      }));
      return {
        success: true,
        batchId: 'IMP-' + Date.now(),
        fileName: fName,
        validRowsCount: valid.length,
        previewData: valid.slice(0, 10),
        validRows: valid
      };
    },
    apiCommitImport: (batchData) => {
      const db = getDB();
      batchData.validRows.forEach(r => {
        r.Status = 'REGISTERED';
        db.VEHICLES.push(r);
      });
      db.BATCHES.unshift({
        BatchID: batchData.batchId,
        FileName: batchData.fileName,
        Company: batchData.company,
        ImportTime: '08/10/2026 09:00:00',
        ImportBy: 'admin@dtk.local',
        TotalRows: batchData.validRowsCount,
        SuccessRows: batchData.validRowsCount,
        ErrorRows: 0,
        Status: 'IMPORTED'
      });
      saveDB(db);
      return { success: true, message: 'Đã import ' + batchData.validRowsCount + ' xe vào Database!' };
    },
    apiGetImportBatches: () => ({ success: true, data: getDB().BATCHES }),
    apiGetCompletedReport: () => {
      const db = getDB();
      const list = db.FEES.map(f => {
        const v = db.VEHICLES.find(i => i.VehicleID === f.VehicleID) || {};
        return {
          feeId: f.FeeID,
          licensePlate: v.LicensePlate || '51C12345',
          vehicleType: f.VehicleType,
          cargoDirection: f.CargoDirection,
          containerNo: v.ContainerNo || '—',
          company: v.Company || '—',
          gateInTime: f.GateInTime,
          gateOutTime: f.GateOutTime,
          totalHours: f.TotalHours,
          chargeDays: f.ChargeDays,
          unitPrice: f.UnitPrice,
          totalAmount: f.TotalAmount,
          formattedTotalAmount: f.TotalAmount.toLocaleString('vi-VN') + ' VNĐ'
        };
      });
      return { success: true, data: list };
    },
    apiGetPriceConfigs: () => ({ success: true, data: getDB().PRICES }),
    apiSavePriceConfig: (data) => {
      const db = getDB();
      if (data.PriceID) {
        const p = db.PRICES.find(i => i.PriceID === data.PriceID);
        if (p) Object.assign(p, data);
      } else {
        data.PriceID = 'PRC-' + Date.now();
        db.PRICES.push(data);
      }
      saveDB(db);
      return { success: true, message: 'Lưu bảng giá thành công' };
    },
    apiGetUsers: () => ({ success: true, data: getDB().USERS }),
    apiSaveUser: (data) => {
      const db = getDB();
      if (data.UserID) {
        const u = db.USERS.find(i => i.UserID === data.UserID);
        if (u) {
          Object.assign(u, data);
          if (data.Password) u.Password = data.Password;
        }
      } else {
        data.UserID = 'USR-' + Date.now();
        data.CreatedAt = '08/10/2026';
        if (!data.Password) data.Password = '123';
        db.USERS.push(data);
      }
      saveDB(db);
      return { success: true, message: 'Lưu tài khoản thành công' };
    },
    apiToggleUserStatus: (uid) => {
      const db = getDB();
      const u = db.USERS.find(i => i.UserID === uid);
      if (u) u.Status = (u.Status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE');
      saveDB(db);
      return { success: true, message: 'Cập nhật trạng thái thành công' };
    },
    apiGetAuditLogs: () => ({ success: true, data: getDB().AUDIT })
  };
})();
</script>
